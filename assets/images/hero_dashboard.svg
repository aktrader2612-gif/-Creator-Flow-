<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- Royal Blue Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#235AE5"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#235AE5"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#235AE5" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="675" rx="20" fill="url(#bgGrad)"/>
  
  <!-- Subtle Mesh Grid Pattern -->
  <g opacity="0.04" stroke="#0f172a" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="405" x2="1200" y2="405"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="240" y1="0" x2="240" y2="675"/>
    <line x1="480" y1="0" x2="480" y2="675"/>
    <line x1="720" y1="0" x2="720" y2="675"/>
    <line x1="960" y1="0" x2="960" y2="675"/>
  </g>

  <!-- Main Container Card -->
  <rect x="80" y="60" width="1040" height="555" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#cardShadow)"/>

  <!-- Sleek Top Header Bar -->
  <rect x="80" y="60" width="1040" height="70" rx="24" fill="#235AE5"/>
  <rect x="80" y="110" width="1040" height="20" fill="#235AE5"/> <!-- Square off bottom corners -->

  <!-- Brand Logo & Title in Header -->
  <g transform="translate(120, 80)">
    <rect width="32" height="32" rx="8" fill="#ffffff" fill-opacity="0.2"/>
    <path d="M18 6L9 17H15L14 26L23 15H17L18 6Z" fill="#ffffff" stroke="#ffffff" stroke-width="1.2"/>
    <text x="44" y="22" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="18" fill="#ffffff">CreatorFlow Hub</text>
  </g>

  <!-- Top Action Badges -->
  <g transform="translate(900, 82)">
    <rect width="180" height="28" rx="14" fill="#ffffff" fill-opacity="0.15"/>
    <circle cx="16" cy="14" r="5" fill="#10b981"/>
    <text x="28" y="18" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#ffffff">AI Workflow Active</text>
  </g>

  <!-- 3 Minimal Visual Feature Cards -->
  <!-- Card 1: Prompts Hub -->
  <g transform="translate(120, 170)">
    <rect width="280" height="380" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect x="20" y="24" width="48" height="48" rx="12" fill="#eff6ff"/>
    <!-- Icon -->
    <path d="M36 40L44 48L60 32" stroke="#235AE5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="20" y="105" font-family="system-ui, sans-serif" font-weight="700" font-size="20" fill="#0f172a">Prompts Library</text>
    <text x="20" y="130" font-family="system-ui, sans-serif" font-weight="500" font-size="13" fill="#64748b">24+ Tested AI Formulas</text>
    
    <!-- Minimal Graphic Lines -->
    <rect x="20" y="160" width="240" height="40" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="35" y="176" width="120" height="8" rx="4" fill="#235AE5"/>
    
    <rect x="20" y="215" width="240" height="40" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="35" y="231" width="160" height="8" rx="4" fill="#94a3b8"/>

    <rect x="20" y="270" width="240" height="40" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="35" y="286" width="90" height="8" rx="4" fill="#94a3b8"/>

    <rect x="20" y="325" width="240" height="36" rx="10" fill="#235AE5"/>
    <text x="140" y="348" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#ffffff">Copy Prompt</text>
  </g>

  <!-- Card 2: 6-Stage Workflow Visual -->
  <g transform="translate(430, 170)">
    <rect width="340" height="380" rx="18" fill="#ffffff" stroke="#235AE5" stroke-width="2" filter="url(#cardShadow)"/>
    <rect x="20" y="24" width="48" height="48" rx="12" fill="#235AE5"/>
    <!-- Icon -->
    <path d="M435 194h20v20h-20z" fill="none"/>
    <circle cx="44" cy="48" r="8" stroke="#ffffff" stroke-width="2.5" fill="none"/>
    <path d="M44 42v12M38 48h12" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    
    <text x="80" y="52" font-family="system-ui, sans-serif" font-weight="700" font-size="20" fill="#0f172a">6-Stage Workflow</text>
    <text x="80" y="72" font-family="system-ui, sans-serif" font-weight="500" font-size="13" fill="#64748b">Repeatable Content Pipeline</text>

    <!-- Visual Nodes Flow Diagram -->
    <g transform="translate(30, 110)">
      <!-- Stage 1 -->
      <rect width="130" height="65" rx="12" fill="#f0f5ff" stroke="#bfdbfe" stroke-width="1.5"/>
      <text x="16" y="28" font-family="system-ui, sans-serif" font-weight="800" font-size="12" fill="#235AE5">01 IDEATION</text>
      <rect x="16" y="40" width="80" height="6" rx="3" fill="#235AE5"/>

      <!-- Stage 2 -->
      <rect x="150" y="0" width="130" height="65" rx="12" fill="#f0f5ff" stroke="#bfdbfe" stroke-width="1.5"/>
      <text x="166" y="28" font-family="system-ui, sans-serif" font-weight="800" font-size="12" fill="#235AE5">02 OUTLINE</text>
      <rect x="166" y="40" width="70" height="6" rx="3" fill="#3b82f6"/>

      <!-- Stage 3 -->
      <rect x="0" y="80" width="130" height="65" rx="12" fill="#f0f5ff" stroke="#bfdbfe" stroke-width="1.5"/>
      <text x="16" y="108" font-family="system-ui, sans-serif" font-weight="800" font-size="12" fill="#235AE5">03 DRAFT</text>
      <rect x="16" y="120" width="90" height="6" rx="3" fill="#235AE5"/>

      <!-- Stage 4 -->
      <rect x="150" y="80" width="130" height="65" rx="12" fill="#f0f5ff" stroke="#bfdbfe" stroke-width="1.5"/>
      <text x="166" y="108" font-family="system-ui, sans-serif" font-weight="800" font-size="12" fill="#235AE5">04 EDIT</text>
      <rect x="166" y="120" width="60" height="6" rx="3" fill="#3b82f6"/>

      <!-- Stage 5 & 6 Bar -->
      <rect x="0" y="160" width="280" height="60" rx="12" fill="#235AE5"/>
      <text x="140" y="196" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#ffffff">05 SEO  •  06 REPURPOSE</text>
    </g>
  </g>

  <!-- Card 3: Growth Metric Visual -->
  <g transform="translate(800, 170)">
    <rect width="280" height="380" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect x="20" y="24" width="48" height="48" rx="12" fill="#ecfdf5"/>
    <path d="M835 200l10-10 8 8 12-14" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <text x="20" y="105" font-family="system-ui, sans-serif" font-weight="700" font-size="20" fill="#0f172a">Freelance ROI</text>
    <text x="20" y="130" font-family="system-ui, sans-serif" font-weight="500" font-size="13" fill="#64748b">5x Faster Deliverables</text>

    <!-- Upward Trend Line Graphic -->
    <g transform="translate(20, 160)">
      <rect width="240" height="120" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <path d="M20 90 Q 70 70, 120 40 T 220 15" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-linecap="round"/>
      <circle cx="220" cy="15" r="6" fill="#235AE5"/>
    </g>

    <!-- Stat Pill -->
    <rect x="20" y="305" width="240" height="48" rx="12" fill="#235AE5" filter="url(#badgeShadow)"/>
    <text x="140" y="335" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="16" fill="#ffffff">+250% Productivity</text>
  </g>
</svg>
